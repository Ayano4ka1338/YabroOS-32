
Section "InputDevice"
    Identifier "YabroMouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
    Option "SendCoreEvents" "true"
    Option "Buttons" "3"
    Option "Emulate3Buttons" "false"
EndSection

Section "InputDevice"
    Identifier "YabroKeyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "XkbRules" "evdev"
    Option "XkbModel" "pc105"
    Option "XkbLayout" "us"
    Option "SendCoreEvents" "true"
EndSection

