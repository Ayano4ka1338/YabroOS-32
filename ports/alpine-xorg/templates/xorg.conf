Section "Files"
    # YabroOS build also flattens modules to / for its module loader; retain
    # that path while explicit InputDevice entries prevent silent hotplug-only
    # configuration when AutoAddDevices is disabled.
    ModulePath "/"
EndSection

Section "Module"
    Load "evdev"
    Disable "glx"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "true"
    Option "AutoAddGPU" "false"
    Option "AllowEmptyInput" "false"
    Option "DontVTSwitch" "true"
    # Keep XKB enabled. Disabling it masks keymap initialization failures and
    # removes normal XKB modifier/layout handling from the native desktop.
    Option "XkbDisable" "false"
EndSection

# This build does not ship Mesa/GLX. Keep the other X11 extensions available;
# xeyes uses Xt resources to select its core-X11 renderer without disabling
# Render/Shape/Present globally for Xft, feh, or other X11 clients.

Section "Device"
    Identifier "Card0"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    # Paint to the actual framebuffer; don't insert a second shadow surface.
    Option "ShadowFB" "false"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    DefaultDepth 24
    DefaultFbBpp 32
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "YabroKeyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "XkbRules" "evdev"
    Option "XkbModel" "pc105"
    Option "XkbLayout" "us"
    Option "SendCoreEvents" "true"
EndSection

Section "InputDevice"
    Identifier "YabroMouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
    Option "SendCoreEvents" "true"
    Option "Buttons" "3"
    Option "Emulate3Buttons" "false"
EndSection

Section "ServerLayout"
    Identifier "YabroLayout"
    Screen "Screen0"
    InputDevice "YabroKeyboard" "CoreKeyboard"
    InputDevice "YabroMouse" "CorePointer"
EndSection
